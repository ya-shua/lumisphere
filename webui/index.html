<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微光域 · 设置</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1d212a; --line:#262b36;
    --txt:#e6e9ef; --dim:#8b93a3; --accent:#5b8cff; --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%,#1a2030 0%,var(--bg) 60%);
    color:var(--txt); font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex; justify-content:center; padding:40px 20px;
  }
  .wrap{width:100%; max-width:760px}
  header{display:flex; align-items:baseline; gap:12px; margin-bottom:6px}
  h1{font-size:26px; margin:0; letter-spacing:.5px}
  .ver{color:var(--dim); font-size:13px}
  .sub{color:var(--dim); font-size:13.5px; margin:0 0 28px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-bottom:16px}
  .card h2{font-size:14px; margin:0 0 4px; color:var(--dim); font-weight:600; letter-spacing:.4px}
  .card p.hint{color:var(--dim); font-size:12.5px; margin:0 0 16px}
  .modes{display:grid; gap:10px}
  .mode{
    background:var(--card2); border:1.5px solid var(--line); border-radius:11px;
    padding:14px 16px; cursor:pointer; transition:.15s; position:relative;
  }
  .mode:hover{border-color:#39404f}
  .mode.on{border-color:var(--accent); background:#1a2236}
  .mode .t{font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:8px}
  .mode .d{color:var(--dim); font-size:12.5px; margin-top:4px}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--line); flex:none}
  .mode.on .dot{background:var(--accent); box-shadow:0 0 8px var(--accent)}
  .tag{font-size:11px; padding:1px 7px; border-radius:20px; background:#2a3140; color:var(--dim)}
  .mode.on .tag{background:#2b3b60; color:#9db6ff}
  .row{display:flex; gap:10px; align-items:center; margin-top:14px}
  input[type=text]{
    flex:1; background:#0d1016; border:1px solid var(--line); color:var(--txt);
    border-radius:9px; padding:10px 12px; font:13px/1.4 ui-monospace,Consolas,monospace; outline:none;
  }
  input[type=text]:focus{border-color:var(--accent)}
  button{
    background:var(--card2); color:var(--txt); border:1px solid var(--line);
    border-radius:9px; padding:10px 16px; font-size:13.5px; cursor:pointer; transition:.15s; white-space:nowrap;
  }
  button:hover{border-color:#39404f}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5; cursor:default}
  .status{display:flex; gap:22px; flex-wrap:wrap; font-size:13px}
  .status div{display:flex; gap:6px; align-items:center}
  .k{color:var(--dim)}
  .v{font-weight:600}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .msg{margin-top:14px; font-size:13px; min-height:20px}
  .msg.err{color:var(--bad)} .msg.good{color:var(--ok)}
  footer{color:#5b6373; font-size:12px; text-align:center; margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>微光域</h1>
    <span class="ver" id="ver"></span>
  </header>
  <p class="sub">这台浏览器归你，也归我。设置改完要重启才生效。</p>

  <div class="card">
    <h2>当前状态</h2>
    <div class="status">
      <div><span class="k">浏览器</span><span class="v" id="browser">—</span></div>
      <div><span class="k">端口</span><span class="v" id="addr">—</span></div>
      <div><span class="k">鉴权</span><span class="v" id="auth">—</span></div>
    </div>
  </div>

  <div class="card">
    <h2>运行模式</h2>
    <p class="hint">浏览器跑在哪、控制端口给谁看。</p>
    <div class="modes" id="modes">
      <div class="mode" data-mode="local">
        <div class="t"><span class="dot"></span>只在本机用 <span class="tag">默认</span></div>
        <div class="d">机器人也在这台电脑上。端口只绑 127.0.0.1，外面碰不到。不用配 token。</div>
      </div>
      <div class="mode" data-mode="bridge">
        <div class="t"><span class="dot"></span>机器人云端 · 浏览器本地</div>
        <div class="d">云服务器性能不够跑浏览器时用这套。端口仍只绑本机，靠 SSH 反向隧道接过去。需要 token。</div>
      </div>
      <div class="mode" data-mode="cloud">
        <div class="t"><span class="dot"></span>全部在云端</div>
        <div class="d">微光域整个跑在云服务器上，端口对外。需要 token，还得套 HTTPS。</div>
      </div>
    </div>

    <div class="row">
      <input type="text" id="token" placeholder="访问令牌（api_token）">
      <button id="gen">生成</button>
    </div>
    <p class="hint" id="tokenHint" style="margin:10px 0 0">本机模式可以留空。另两种模式必须填，不然程序会拒绝开端口。</p>
  </div>

  <div class="row" style="justify-content:flex-end">
    <button class="primary" id="save">保存</button>
  </div>
  <div class="msg" id="msg"></div>

  <footer>改完记得重启微光域（托盘右键 → 退出，再双击启动.bat）</footer>
</div>

<script>
let state = { mode: "local", hasToken: false };

const $ = (id) => document.getElementById(id);

function paint() {
  document.querySelectorAll(".mode").forEach((el) => {
    el.classList.toggle("on", el.dataset.mode === state.mode);
  });
  $("tokenHint").textContent = state.mode === "local"
    ? "本机模式可以留空。另两种模式必须填，不然程序会拒绝开端口。"
    : "这个模式必须填 token，否则程序不会开端口。点「生成」自动来一个。";
}

function fmt(bytes) { return bytes ? (bytes / 1024).toFixed(0) + " KB" : "—"; }

async function load() {
  try {
    const r = await fetch("/api/config");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    state.mode = d.mode || "local";
    state.hasToken = !!d.api_token_set;
    $("ver").textContent = "v" + (d.version || "?");
    $("addr").textContent = (d.host || "?") + ":" + (d.port || "?");
    $("auth").innerHTML = d.api_token_set
      ? '<span class="ok">已开启</span>'
      : '<span class="warn">未开启</span>';
    $("browser").innerHTML = d.browser_ok
      ? '<span class="ok">运行中</span>'
      : '<span class="bad">未连接</span>';
    if (d.api_token_set) $("token").placeholder = "已设置（留空则不修改）";
    paint();
  } catch (e) {
    $("msg").className = "msg err";
    $("msg").textContent = "读不到配置：" + e.message;
  }
}

document.querySelectorAll(".mode").forEach((el) => {
  el.addEventListener("click", () => {
    state.mode = el.dataset.mode;
    paint();
  });
});

$("gen").addEventListener("click", async () => {
  const r = await fetch("/api/token", { method: "POST" });
  const d = await r.json();
  $("token").value = d.token || "";
  $("token").placeholder = "";
});

$("save").addEventListener("click", async () => {
  const btn = $("save");
  btn.disabled = true;
  $("msg").className = "msg";
  $("msg").textContent = "保存中……";
  try {
    const body = { mode: state.mode, api_token: $("token").value.trim() };
    const r = await fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || ("HTTP " + r.status));
    $("msg").className = "msg good";
    $("msg").textContent = "已保存。重启微光域后生效。";
    $("token").value = "";
    await load();
  } catch (e) {
    $("msg").className = "msg err";
    $("msg").textContent = "保存失败：" + e.message;
  } finally {
    btn.disabled = false;
  }
});

load();
</script>
</body>
</html>
